name: Release

on:
  push:
    branches: [main]
    paths:
      - "somfy-protexial-card.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lire la version dans le fichier JS
        id: version
        run: |
          VERSION=$(grep -oP '(?<![A-Za-z0-9_])CARD_VERSION\s*=\s*"v\K[0-9.]+' somfy-protexial-card.js | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Version introuvable dans somfy-protexial-card.js"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Vérifier que le tag n'existe pas déjà
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Générer le changelog
        id: changelog
        if: steps.check.outputs.exists == 'false'
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo 'notes<<EOF'
            git log $RANGE --pretty=format:'- %s (%h)' --no-merges --invert-grep --grep='^Bump'
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Créer le tag + la release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## Changements
            ${{ steps.changelog.outputs.notes }}
